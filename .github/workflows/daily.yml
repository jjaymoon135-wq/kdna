name: Korea CRE Radar

on:
  schedule:
    # Times are UTC. 14:17 UTC = 11:17 PM in Korea (all year; Korea has no
    # daylight saving) = 6:17 AM Pacific Standard / 7:17 AM Pacific Daylight.
    # The odd minute (:17) is on purpose: GitHub delays runs scheduled on the
    # hour. GitHub's own timer has been starting runs hours late, so for an
    # on-time start trigger this workflow from an outside timer too (the
    # workflow_dispatch below). This schedule then acts as a free backup.
    - cron: "17 14 * * 1-5"   # Mon–Fri
  workflow_dispatch:          # lets you run it manually / from an outside timer

# Allow the workflow to commit the refreshed page back to the repo
permissions:
  contents: write

# Never run two at once (a manual click during a scheduled run just waits)
concurrency:
  group: radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's page
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python generate.py

      - name: Commit updated page
        run: |
          git config user.name  "korea-cre-radar-bot"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "Radar update $(date -u +'%Y-%m-%d')" || echo "No changes"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
