name: Korea CRE Radar

on:
  schedule:
    # Times are UTC. GitHub starts scheduled runs HOURS late (measured 6h40m to
    # 9h45m, even at an off-peak minute), and the news is fetched when the run
    # actually STARTS, not at the scheduled time. So we schedule early to land
    # in the morning, plus a second run as a midday refresh:
    #   07:17 UTC = 11:17 PM Pacific (PST) the night before = 4:17 PM Korea.
    #               With the usual delay it starts around 14:17 UTC (6-9 AM Pacific).
    #   14:17 UTC = 11:17 PM Korea. With the usual delay it starts around midday
    #               Pacific and picks up Korea's evening news.
    # If GitHub ever runs on time, both are still useful. Headlines already
    # judged are remembered, so the second run costs very little.
    - cron: "17 7 * * 1-5"    # Mon-Fri
    - cron: "17 14 * * 1-5"   # Mon-Fri
  workflow_dispatch:          # lets you run it manually / from an outside timer

# Allow the workflow to commit the refreshed page back to the repo
permissions:
  contents: write

# Never run two at once (a manual click during a scheduled run just waits)
concurrency:
  group: radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's page
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python generate.py

      - name: Commit updated page
        run: |
          git config user.name  "korea-cre-radar-bot"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "Radar update $(date -u +'%Y-%m-%d')" || echo "No changes"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
